services:
  storefront:
    build:
      context: ./storefront
    ports:
      - "3000:3000"
    env_file:
      - ./storefront/.env.local
    command: npm run dev
  admin:
    build:
      context: ./admin
    ports:
      - "3001:3000"
    env_file:
      - ./admin/.env.local
    environment:
      BACKEND_URL: "http://backend:4000"
    command: npm run dev

  postgres:
    image: postgres:17-alpine
    container_name: seetha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seetha_vastram
      POSTGRES_USER: seetha
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seetha -d seetha_vastram"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seetha-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: seetha-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://seetha:local_dev_password@postgres:5432/seetha_vastram
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    container_name: seetha-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy



volumes:
  postgres_data:
  redis_data: